# Backend on a VPS. The frontend lives on Cloudflare (Pages/Workers).
#
#   cd deploy
#   cp ../.env ../.env.production   # fill in the real values
#   docker compose up -d --build
#
# Keep exactly ONE replica: the scheduler and outbox worker are in-process and
# the store is SQLite (see docs/DEPLOYMENT.md).

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      WASIGNAL_ENV: production
      WASIGNAL_DATA_DIR: /data
      # Set to your API host's parent domain to share cookies with the web app:
      # WASIGNAL_COOKIE_DOMAIN: .wasignal.com
      WASIGNAL_COOKIE_SECURE: "true"
      # Browser origins allowed to call the API directly:
      # WASIGNAL_CORS_ORIGINS: https://app.wasignal.com,https://wasignal.pages.dev
    volumes:
      - wasignal-data:/data
    ports:
      # Bind to loopback only when Caddy/cloudflared sits in front.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: terminate TLS in-container instead of Caddy.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config

volumes:
  wasignal-data:
  # caddy-data:
  # caddy-config:
